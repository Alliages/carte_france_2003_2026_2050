name: Vérification

on: [push, pull_request]

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: js/data.js est à jour avec data/
        run: |
          python3 build/build_data.py
          git diff --exit-code js/data.js
      - name: Syntaxe des scripts
        run: for f in js/config.js js/utils.js js/calculs.js js/dessin.js js/exports.js js/script.js; do node --check "$f"; done
